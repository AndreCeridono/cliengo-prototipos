<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="t">
  <title id="t">Cómo funciona el link de chat: eliges tu link, lo compartes, tus clientes chatean y cada conversación llega a tu bandeja con el origen del link</title>
  <style>
    text { font-family: Inter, 'Segoe UI', Arial, sans-serif; fill: #040305; }
    .k { font-size: 17px; font-weight: 700; letter-spacing: .08em; fill: #6234B2; }
    .b { font-size: 24px; font-weight: 700; }
    .s { font-size: 19px; fill: #4a4458; }
    .card { fill: #FFFFFF; stroke: #E4DAFD; stroke-width: 2; }
    .ring { fill: none; stroke: #7F44F8; stroke-width: 4; opacity: 0; }
    .line { stroke: #D9CCFC; stroke-width: 4; stroke-dasharray: 2 10; stroke-linecap: round; }
    .dot { fill: #7F44F8; opacity: 0; }
    .ok { opacity: 0; }
    .r1 { animation: on 8s infinite; }
    .r2 { animation: on 8s 2s infinite; }
    .r3 { animation: on 8s 4s infinite; }
    .r4 { animation: on 8s 6s infinite; }
    .d1 { animation: drop 8s 1.2s infinite; }
    .d2 { animation: drop 8s 3.2s infinite; }
    .d3 { animation: drop 8s 5.2s infinite; }
    .ok { animation: pop 8s infinite; }
    @keyframes on { 0% { opacity: 0 } 4%, 22% { opacity: 1 } 26%, 100% { opacity: 0 } }
    @keyframes drop { 0% { opacity: 0; transform: translateY(0) } 2% { opacity: 1 } 10% { opacity: 1; transform: translateY(28px) } 12%, 100% { opacity: 0; transform: translateY(28px) } }
    @keyframes pop { 0%, 84% { opacity: 0 } 87%, 97% { opacity: 1 } 100% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) {
      .r1, .r2, .r3, .r4, .d1, .d2, .d3, .ok { animation: none; }
      .ok { opacity: 1; }
    }
  </style>
  <rect width="720" height="640" rx="24" fill="#F6F2FF"/>

  <rect class="card" x="40" y="40" width="640" height="118" rx="16"/>
  <rect class="ring r1" x="40" y="40" width="640" height="118" rx="16"/>
  <circle cx="96" cy="99" r="28" fill="#6234B2"/>
  <path d="M90 105 l-3 3 a6 6 0 0 1 -8.5 -8.5 l6 -6 a6 6 0 0 1 8.5 0 M102 93 l3 -3 a6 6 0 0 1 8.5 8.5 l-6 6 a6 6 0 0 1 -8.5 0" stroke="#FFFFFA" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <text class="k" x="144" y="82">PASO 1</text>
  <text class="b" x="144" y="114">Elige tu link</text>
  <text class="s" x="144" y="142">chat.cliengo.com/tu-negocio</text>

  <line class="line" x1="96" y1="164" x2="96" y2="194"/>
  <circle class="dot d1" cx="96" cy="164" r="8"/>

  <rect class="card" x="40" y="200" width="640" height="118" rx="16"/>
  <rect class="ring r2" x="40" y="200" width="640" height="118" rx="16"/>
  <circle cx="96" cy="259" r="28" fill="#EFE8FF" stroke="#6234B2" stroke-width="3"/>
  <path d="M84 259 h24 M98 249 l10 10 -10 10" stroke="#6234B2" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="k" x="144" y="242">PASO 2</text>
  <text class="b" x="144" y="274">Compártelo</text>
  <text class="s" x="144" y="302">en tu bio, por WhatsApp o como QR</text>

  <line class="line" x1="96" y1="324" x2="96" y2="354"/>
  <circle class="dot d2" cx="96" cy="324" r="8"/>

  <rect class="card" x="40" y="360" width="640" height="118" rx="16"/>
  <rect class="ring r3" x="40" y="360" width="640" height="118" rx="16"/>
  <circle cx="96" cy="419" r="28" fill="#6234B2"/>
  <path d="M83 407 h26 a3 3 0 0 1 3 3 v14 a3 3 0 0 1 -3 3 h-17 l-8 6 v-6 a3 3 0 0 1 -4 -3 v-14 a3 3 0 0 1 3 -3 z" fill="none" stroke="#FFFFFA" stroke-width="3" stroke-linejoin="round"/>
  <text class="k" x="144" y="402">PASO 3</text>
  <text class="b" x="144" y="434">Tus clientes chatean</text>
  <text class="s" x="144" y="462">a pantalla completa, con tu marca</text>

  <line class="line" x1="96" y1="484" x2="96" y2="496"/>
  <circle class="dot d3" cx="96" cy="484" r="8"/>

  <rect class="card" x="40" y="502" width="640" height="118" rx="16"/>
  <rect class="ring r4" x="40" y="502" width="640" height="118" rx="16"/>
  <circle cx="96" cy="561" r="28" fill="#EFE8FF" stroke="#6234B2" stroke-width="3"/>
  <path d="M82 552 h28 v20 h-28 z M82 564 h8 l3 4 h6 l3 -4 h8" stroke="#6234B2" stroke-width="3" fill="none" stroke-linejoin="round"/>
  <text class="k" x="144" y="544">PASO 4</text>
  <text class="b" x="144" y="576">Sigue cada lead</text>
  <text class="s" x="144" y="604">llega a tu bandeja con el origen del link</text>

  <g class="ok">
    <rect x="488" y="520" width="176" height="40" rx="20" fill="#EFE8FF"/>
    <circle cx="510" cy="540" r="5" fill="#6234B2"/>
    <text x="524" y="547" style="font-size:17px;font-weight:700;fill:#6234B2">Link de chat</text>
  </g>
</svg>
